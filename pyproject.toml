[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsbrief"
version = "0.1.0"
description = "Collect the day's news from RSS/Atom and Hacker News, dedupe, rank, summarize with Claude, and email a daily brief."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
newsbrief = "newsbrief.cli:main"

[tool.setuptools.packages.find]
include = ["newsbrief*"]

[tool.setuptools.package-data]
newsbrief = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
