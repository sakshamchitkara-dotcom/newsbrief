# Copy to newsbrief.yaml and edit. Nobody receives email unless listed under `subscribers`.
from_email: "The Daily Brief <brief@example.com>"
# Public URL of whatever serves /unsubscribe (see README). Leave empty for mailto-only unsubscribe.
base_url: ""
state_db: newsbrief.db
outbox: outbox
max_stories: 12
lookback_hours: 36
fetch_articles: true   # fetch article pages (robots.txt respected) for better summaries

sources:
  bbc-world:   {type: rss, url: "https://feeds.bbci.co.uk/news/world/rss.xml", weight: 1.3, topics: [world]}
  bbc-business: {type: rss, url: "https://feeds.bbci.co.uk/news/business/rss.xml", weight: 1.1, topics: [business]}
  npr:         {type: rss, url: "https://feeds.npr.org/1001/rss.xml", weight: 1.2, topics: [world, us]}
  guardian:    {type: rss, url: "https://www.theguardian.com/world/rss", weight: 1.2, topics: [world]}
  aljazeera:   {type: rss, url: "https://www.aljazeera.com/xml/rss/all.xml", weight: 1.1, topics: [world]}
  verge:       {type: rss, url: "https://www.theverge.com/rss/index.xml", weight: 1.0, topics: [tech]}
  ars:         {type: rss, url: "https://feeds.arstechnica.com/arstechnica/index", weight: 1.0, topics: [tech, science]}
  hn:          {type: hackernews, url: topstories, limit: 30, weight: 0.9, topics: [tech]}
  # Page scraping (robots.txt respected): pulls headline-looking links from a section page.
  # npr-science: {type: page, url: "https://www.npr.org/sections/science/", topics: [science]}

subscribers:
  - email: you@example.com
    name: You
    timezone: America/New_York
    send_at: "07:00"
    # topics: [world, tech]     # optional: restrict by topic
    # sources: [bbc-world, hn]  # optional: restrict by source name
    # max_stories: 8
